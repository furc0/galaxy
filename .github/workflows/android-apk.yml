name: Build Android APK

on:
  push:
    branches:
      - main
      - fix/typescript-missing-imports
    paths:
      - "galaxy/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish installable APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: galaxy/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install web dependencies
        working-directory: galaxy
        run: npm ci

      - name: Build web application
        working-directory: galaxy
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: galaxy
        run: npx cap sync android

      - name: Build APK
        working-directory: galaxy/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare release APK
        run: cp galaxy/android/app/build/outputs/apk/debug/app-debug.apk Prizma.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Prizma-debug-apk
          path: Prizma.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Призма — последняя версия APK
          body: |
            Автоматическая сборка Android-приложения «Призма».

            Установка: скачайте Prizma.apk на Android-устройство и откройте файл.
            При запросе разрешите установку приложений из этого источника.
          files: Prizma.apk
          overwrite_files: true
          make_latest: true
